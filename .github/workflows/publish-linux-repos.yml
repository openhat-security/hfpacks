# Rebuild apt + dnf Pages repo (openhat-security/packages) from hfpacks + runhug .deb/.rpm.
name: Publish Linux repos

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: hfpacks release tag (e.g. v0.2.1). Empty = event release or latest hfpacks.
        required: false
        default: ""

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Resolve hfpacks tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-}"
          if [ -z "$TAG" ]; then TAG="${RELEASE_TAG:-}"; fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --json tagName -q .tagName -R openhat-security/hfpacks)
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using hfpacks tag $TAG"

      - name: Download deb/rpm assets (hfpacks + runhug)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pkgs
          gh release download "$TAG" -R openhat-security/hfpacks -D /tmp/pkgs -p '*.deb' -p '*.rpm' || true
          RUNHUG_TAG=$(gh release view --json tagName -q .tagName -R openhat-security/runhug)
          gh release download "$RUNHUG_TAG" -R openhat-security/runhug -D /tmp/pkgs -p '*.deb' -p '*.rpm' || true
          ls -la /tmp/pkgs || true
          if ! ls /tmp/pkgs/*.deb >/dev/null 2>&1 && ! ls /tmp/pkgs/*.rpm >/dev/null 2>&1; then
            echo "No .deb/.rpm — skip Pages publish"
            echo "skip=1" >> "$GITHUB_ENV"
          else
            echo "skip=0" >> "$GITHUB_ENV"
          fi

      - name: Build apt + dnf trees
        if: env.skip != '1'
        run: bash packaging/repo/build-pages-repos-combined.sh /tmp/pkgs public

      - name: Push site to packages (main)
        if: env.skip != '1'
        uses: actions/checkout@v7
        with:
          repository: openhat-security/packages
          token: ${{ secrets.PACKAGING_TOKEN || secrets.GITHUB_TOKEN }}
          path: packages-repo

      - name: Sync packages repo
        if: env.skip != '1'
        working-directory: packages-repo
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "hfpacks-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout main
          git pull --ff-only origin main || true
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name 'README.md' -exec rm -rf {} +
          cp -a ../public/. .
          touch .nojekyll
          git add -A
          if git diff --cached --quiet; then
            echo "No repo changes"
            exit 0
          fi
          git commit -m "sync packages from hfpacks ${TAG} (+ runhug debs/rpms)"
          git push origin main
