# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: hfpacks

before:
  hooks:
    - go mod tidy

builds:
  - id: hfpacks
    main: ./cmd/hfpacks
    binary: hfpacks
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/openhat-security/hfpacks/internal/version.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: default
    formats: [binary]
    name_template: "hfpacks_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: SHA256SUMS.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: openhat-security
    name: hfpacks
  draft: false
  prerelease: auto
  name_template: "v{{.Version}}"

nfpms:
  - id: packages
    ids:
      - hfpacks
    package_name: hfpacks
    file_name_template: "hfpacks_{{ .Version }}_{{ .Arch }}"
    homepage: https://github.com/openhat-security/hfpacks
    maintainer: OpenHat Security <opensource@openhat.dev>
    description: Build Hugging Face Hub index packs for runhug (SQLite, csv, parquet).
    license: MIT
    section: utils
    priority: optional
    formats:
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: LICENSE
        dst: /usr/share/doc/hfpacks/LICENSE
        type: doc
      - src: README.md
        dst: /usr/share/doc/hfpacks/README.md
        type: doc

homebrew_casks:
  - name: hfpacks
    ids:
      - default
    skip_upload: '{{ not (isEnvSet "HOMEBREW_TAP_TOKEN") }}'
    repository:
      owner: openhat-security
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Casks
    homepage: https://github.com/openhat-security/hfpacks
    description: Build Hugging Face Hub index packs for runhug.
    license: MIT
    commit_author:
      name: hfpacks-bot
      email: 41898282+github-actions[bot]@users.noreply.github.com
    binaries:
      - hfpacks
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}"]
          end

scoops:
  - name: hfpacks
    ids:
      - default
    skip_upload: '{{ not (isEnvSet "SCOOP_TOKEN") }}'
    repository:
      owner: openhat-security
      name: scoop-bucket
      token: "{{ .Env.SCOOP_TOKEN }}"
    directory: bucket
    homepage: https://github.com/openhat-security/hfpacks
    description: Build Hugging Face Hub index packs for runhug.
    license: MIT
    commit_author:
      name: hfpacks-bot
      email: 41898282+github-actions[bot]@users.noreply.github.com
    url_template: "https://github.com/openhat-security/hfpacks/releases/download/{{ .Tag }}/{{ .ArtifactName }}"

snapshot:
  version_template: "{{ .Version }}-next"
